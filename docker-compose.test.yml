# Base desechable para las pruebas de integración del backend (local y CI).
#   docker compose -f docker-compose.test.yml up -d --wait
# Guarda los datos en memoria y solo escucha en 127.0.0.1:55432. Las claves son de prueba.
name: limpieza-test

services:
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: limpieza_test
      OWNER_PASSWORD: owner_test
      APP_PASSWORD: app_test
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d limpieza_test"]
      interval: 2s
      timeout: 3s
      retries: 30
