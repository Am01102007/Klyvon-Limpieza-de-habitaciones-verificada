name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, pruebas, auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://limpieza_app:app_test@127.0.0.1:55432/limpieza_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://limpieza_owner:owner_test@127.0.0.1:55432/limpieza_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL de pruebas (con los roles y RLS reales)
        working-directory: .
        run: docker compose -f docker-compose.test.yml up -d --wait
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - name: Instalar dependencias
        run: uv sync --frozen --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests migrations scripts
      - name: Pruebas unitarias y de integración (cobertura mínima 80 % en services/)
        run: uv run pytest --cov=app/services --cov-report=term-missing --cov-fail-under=80
      - name: Auditoría de dependencias (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > requisitos.txt
          uvx pip-audit --strict -r requisitos.txt

  frontend:
    name: Frontend (lint, tipos, pruebas, build, E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high
      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: E2E con API simulada (escritorio, Android, iPhone)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  stack:
    name: Docker compose + E2E del stack real
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env con secretos desechables
        run: |
          cp .env.example .env
          for clave in POSTGRES_PASSWORD OWNER_PASSWORD APP_PASSWORD JWT_SECRETO FOTOS_FIRMA_SECRETO SEMILLA_CLAVE; do
            sed -i "s/^${clave}=.*/${clave}=$(openssl rand -hex 32)/" .env
          done
      - name: Construir y levantar
        run: docker compose up -d --build --wait
      - name: Datos de demostración
        run: docker compose run --rm migrate python -m scripts.semilla
      - uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: E2E contra el stack (offline, PWA, cabeceras)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          E2E_URL=http://localhost E2E_CLAVE="$(grep '^SEMILLA_CLAVE=' ../.env | cut -d= -f2)" pnpm test:e2e:stack
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --tail 200
      - name: Apagar
        if: always()
        run: docker compose down -v
